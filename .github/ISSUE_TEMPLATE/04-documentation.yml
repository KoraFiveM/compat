name: Documentation Issue
description: Report missing, outdated or unclear documentation for PolyZone.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in PolyZone
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Legacy imports, Zone behavior, Manifest setup, Compatibility.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
